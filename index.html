<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>نبض</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:#fff;font-family:Tajawal,system-ui,sans-serif}
#feed{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.card{height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;background:#000}
.card video{width:100%;height:100%;object-fit:contain}
.info{position:absolute;inset-inline:14px 84px;bottom:calc(76px + env(safe-area-inset-bottom,0px));text-shadow:0 1px 6px #000}
.info b{font-size:17px;display:block;margin-bottom:4px}
.info p{font-size:15px;line-height:1.5;max-height:4.5em;overflow:hidden}
.side{position:absolute;inset-inline-end:10px;bottom:calc(90px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:18px}
.av{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#333;border:2px solid #fff}
.ib{background:none;border:0;color:#fff;font:inherit;font-size:30px;line-height:1;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;text-shadow:0 1px 6px #000}
.ib small{font-size:12px}
.ib.on{color:#fe2c55}
nav{position:fixed;inset-inline:0;bottom:0;height:calc(58px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:flex;align-items:center;justify-content:space-around;background:#000;border-top:1px solid #222;z-index:5}
nav button{background:none;border:0;color:#fff;font:inherit;font-size:14px;opacity:.85;min-width:70px;padding:8px}
nav .plus{width:50px;height:34px;min-width:0;padding:0;background:#fff;color:#000;border-radius:10px;font-size:24px;font-weight:700;opacity:1;box-shadow:-3px 0 #25f4ee,3px 0 #fe2c55}
#empty{height:100dvh;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;color:#aaa;line-height:1.8}
#hint{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));inset-inline:0;text-align:center;font-size:13px;color:#ddd;z-index:4;pointer-events:none}
dialog{margin:auto;width:min(92vw,420px);background:#161616;color:#fff;border:1px solid #333;border-radius:14px;padding:18px}
dialog::backdrop{background:#000a}
dialog h2{font-size:19px;margin-bottom:12px}
dialog input,dialog textarea{width:100%;background:#000;color:#fff;border:1px solid #444;border-radius:8px;padding:10px;font:inherit;margin:6px 0}
dialog .b{width:100%;padding:11px;margin:5px 0;border:0;border-radius:8px;background:#fe2c55;color:#fff;font:inherit;font-weight:700}
dialog .b.g{background:#2a2a2a}
dialog .w{font-size:13px;color:#e8b04a;line-height:1.6;margin:8px 0}
#st,#out{font-size:13px;color:#aaa;word-break:break-all;margin-top:6px}
:focus-visible{outline:2px solid #25f4ee;outline-offset:2px}
</style>
</head>
<body>
<div id="hint">اضغط على الفيديو لتشغيل أو كتم الصوت</div>
<div id="feed"><div id="empty">جارٍ جلب الفيديوهات من المرحّلات…<br>إن لم يظهر شيء، سجّل الدخول وانشر أول فيديو.</div></div>
<nav>
<button id="nHome">الرئيسية</button>
<button class="plus" id="nPost" aria-label="نشر فيديو">+</button>
<button id="nMe">حسابي</button>
</nav>

<dialog id="dLogin"><h2>حسابي</h2><div id="loginBody"></div><button class="b g" id="xLogin">إغلاق</button></dialog>

<dialog id="dPost"><h2>نشر فيديو</h2>
<input type="file" id="f" accept="video/*">
<input id="u" placeholder="أو الصق رابط فيديو (https://…)" dir="ltr">
<textarea id="c" rows="3" placeholder="اكتب وصفاً للفيديو"></textarea>
<button class="b" id="go">نشر</button><button class="b g" id="xPost">إلغاء</button>
<div id="st"></div></dialog>

<script src="https://cdn.jsdelivr.net/npm/nostr-tools@2.7.2/lib/nostr.bundle.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
const NT=window.NostrTools;
const RELAYS=["wss://relay.damus.io","wss://nos.lol","wss://relay.primal.net"];
const BLOSSOM="https://blossom.primal.net";
const $=s=>document.querySelector(s);
const el=(t,p={},...k)=>{const e=document.createElement(t);Object.assign(e,p);k.forEach(x=>e.append(x));return e};
const now=()=>Math.floor(Date.now()/1000);
const hex=b=>[...b].map(x=>x.toString(16).padStart(2,"0")).join("");
let sk=null,pk=null,muted=true;
const seen=new Set(),subs={},handlers={},socks=[];

/* ---------- relays ---------- */
function open1(u){
  const w=new WebSocket(u);
  w.onopen=()=>Object.values(subs).forEach(s=>w.send(s));
  w.onmessage=e=>{try{const m=JSON.parse(e.data);if(m[0]=="EVENT"&&handlers[m[1]])handlers[m[1]](m[2])}catch{}};
  w.onclose=()=>{const i=socks.indexOf(w);if(i>-1)socks.splice(i,1);setTimeout(()=>open1(u),6000)};
  socks.push(w);
}
function sub(id,filters,cb){
  subs[id]=JSON.stringify(["REQ",id,...filters]);handlers[id]=cb;
  socks.forEach(w=>w.readyState==1&&w.send(subs[id]));
}
function publish(ev){const m=JSON.stringify(["EVENT",ev]);socks.forEach(w=>w.readyState==1&&w.send(m))}

/* ---------- identity ---------- */
async function sign(t){
  if(sk)return NT.finalizeEvent(t,sk);
  if(window.nostr)return window.nostr.signEvent(t);
  throw new Error("no key");
}
function setKey(s){
  sk=s;pk=NT.getPublicKey(s);
  try{localStorage.setItem("nsec",NT.nip19.nsecEncode(s))}catch{}
  ui();
}
function logout(){sk=null;pk=null;try{localStorage.removeItem("nsec")}catch{}ui();renderLogin()}
function ui(){$("#nMe").textContent=pk?"حسابي ✓":"دخول"}
function ok(){if(pk)return true;renderLogin();$("#dLogin").showModal();return false}

function renderLogin(){
  const b=$("#loginBody");b.replaceChildren();
  if(pk){
    b.append(el("p",{textContent:"مسجّل الدخول: "+NT.nip19.npubEncode(pk).slice(0,20)+"…"}),
      el("button",{className:"b g",textContent:"تسجيل الخروج",onclick:logout}));
    return;
  }
  const out=el("div",{id:"out"});
  const inp=el("input",{placeholder:"nsec1… (المفتاح الخاص)",dir:"ltr",type:"password"});
  b.append(
    el("button",{className:"b",textContent:"الدخول عبر محفظة نوستر",onclick:async()=>{
      if(!window.nostr){out.textContent="لا توجد محفظة في هذا المتصفح. استخدم المفتاح أدناه.";return}
      try{pk=await window.nostr.getPublicKey();sk=null;ui();renderLogin()}catch{out.textContent="تم الرفض"}
    }}),
    el("button",{className:"b g",textContent:"إنشاء مفتاح جديد",onclick:()=>{
      const s=NT.generateSecretKey();setKey(s);
      renderLogin();
      $("#loginBody").prepend(el("p",{className:"w",textContent:"احفظ مفتاحك الخاص الآن في مكان آمن، فلا يمكن استرجاعه: "+NT.nip19.nsecEncode(s)}));
    }}),
    inp,
    el("button",{className:"b g",textContent:"الدخول بالمفتاح الخاص",onclick:()=>{
      try{const d=NT.nip19.decode(inp.value.trim());if(d.type!="nsec")throw 0;setKey(d.data);renderLogin()}
      catch{out.textContent="مفتاح غير صالح"}
    }}),
    el("p",{className:"w",textContent:"تنبيه: لا تُدخل مفتاحك الخاص إلا في نسختك أنت من الموقع. يُحفظ على جهازك فقط ولا يُرسل لأي خادم."}),
    out);
}

/* ---------- feed ---------- */
const obs=new IntersectionObserver(es=>es.forEach(e=>{
  const v=e.target.querySelector("video");
  if(e.isIntersecting){load(v);v.muted=muted;v.play().catch(()=>{})}else v.pause();
}),{threshold:.65});

function load(v){
  if(v.dataset.l)return;v.dataset.l=1;const u=v.dataset.src;
  if(/\.m3u8/i.test(u)&&window.Hls&&Hls.isSupported()){const h=new Hls();h.loadSource(u);h.attachMedia(v)}
  else v.src=u;
}
function urlOf(ev){
  for(const t of ev.tags){
    if(t[0]=="imeta"){const u=t.find(x=>x.startsWith("url "));if(u)return u.slice(4)}
    if(t[0]=="url")return t[1];
  }
  const m=ev.content.match(/https?:\/\/\S+\.(mp4|webm|mov|m3u8)\S*/i);return m&&m[0];
}
function addCard(ev){
  if(seen.has(ev.id))return;
  const u=urlOf(ev);if(!u||!/^https:/.test(u))return;
  seen.add(ev.id);
  const v=el("video",{loop:true,playsInline:true,muted:true,preload:"metadata"});v.dataset.src=u;
  v.onclick=()=>{muted=!muted;$("#hint").remove();document.querySelectorAll("video").forEach(x=>x.muted=muted)};
  const caption=ev.content.replace(/https?:\/\/\S+/g,"").trim();
  const like=el("button",{className:"ib",ariaLabel:"إعجاب"},"♥",el("small",{textContent:"أعجبني"}));
  like.onclick=()=>{
    if(!ok())return;
    sign({kind:7,created_at:now(),content:"+",tags:[["e",ev.id],["p",ev.pubkey]]}).then(publish).catch(()=>{});
    like.classList.add("on");
  };
  const share=el("button",{className:"ib",ariaLabel:"مشاركة"},"↗",el("small",{textContent:"مشاركة"}));
  share.onclick=()=>{
    const link="https://njump.me/"+NT.nip19.neventEncode({id:ev.id,author:ev.pubkey});
    navigator.share?navigator.share({url:link}).catch(()=>{}):navigator.clipboard.writeText(link);
  };
  const card=el("section",{className:"card"},v,
    el("div",{className:"side"},el("img",{className:"av",alt:""}),like,share),
    el("div",{className:"info"},el("b",{className:"nm",textContent:"@"+NT.nip19.npubEncode(ev.pubkey).slice(5,13)}),el("p",{textContent:caption||ev.tags.find(t=>t[0]=="title")?.[1]||""})));
  card.dataset.pk=ev.pubkey;card.dataset.t=ev.created_at;
  const f=$("#feed");$("#empty")&&$("#empty").remove();
  const next=[...f.children].find(c=>+c.dataset.t<ev.created_at);
  f.insertBefore(card,next||null);obs.observe(card);wantProfile(ev.pubkey);
}

const need=new Set(),known=new Set();let pt;
function wantProfile(p){
  if(known.has(p))return;known.add(p);need.add(p);clearTimeout(pt);
  pt=setTimeout(()=>{
    sub("p"+Date.now(),[{kinds:[0],authors:[...need]}],e=>{
      try{
        const d=JSON.parse(e.content);
        document.querySelectorAll(`[data-pk="${e.pubkey}"]`).forEach(c=>{
          const n=d.display_name||d.name;if(n)c.querySelector(".nm").textContent="@"+n;
          if(d.picture&&/^https:/.test(d.picture))c.querySelector(".av").src=d.picture;
        });
      }catch{}
    });
    need.clear();
  },400);
}

/* ---------- publish ---------- */
async function upload(file){
  const h=hex(new Uint8Array(await crypto.subtle.digest("SHA-256",await file.arrayBuffer())));
  const a=await sign({kind:24242,created_at:now(),content:"Upload video",tags:[["t","upload"],["x",h],["expiration",String(now()+600)]]});
  const r=await fetch(BLOSSOM+"/upload",{method:"PUT",headers:{Authorization:"Nostr "+btoa(JSON.stringify(a)),"Content-Type":file.type||"video/mp4"},body:file});
  if(!r.ok)throw new Error("upload");
  return (await r.json()).url;
}
const mime=u=>/\.webm/i.test(u)?"video/webm":/\.m3u8/i.test(u)?"application/x-mpegURL":"video/mp4";
$("#go").onclick=async()=>{
  const st=$("#st");
  try{
    let u=$("#u").value.trim();const f=$("#f").files[0],c=$("#c").value.trim();
    if(f){st.textContent="جارٍ الرفع…";u=await upload(f)}
    if(!/^https:\/\//.test(u)){st.textContent="اختر ملفاً أو ألصق رابطاً يبدأ بـ https";return}
    const m=f?(f.type||"video/mp4"):mime(u);
    const ev=await sign({kind:22,created_at:now(),content:c,tags:[["title",c.slice(0,60)],["imeta","url "+u,"m "+m],["alt",c||"video"]]});
    publish(ev);addCard(ev);
    st.textContent="تم النشر";$("#dPost").close();$("#f").value="";$("#u").value="";$("#c").value="";
  }catch(e){st.textContent="تعذّر النشر. تأكد من تسجيل الدخول ومن حجم الملف."}
};

/* ---------- wiring ---------- */
$("#nHome").onclick=()=>$("#feed").scrollTo({top:0,behavior:"smooth"});
$("#nPost").onclick=()=>{if(ok()){$("#st").textContent="";$("#dPost").showModal()}};
$("#nMe").onclick=()=>{renderLogin();$("#dLogin").showModal()};
$("#xLogin").onclick=()=>$("#dLogin").close();
$("#xPost").onclick=()=>$("#dPost").close();

RELAYS.forEach(open1);
sub("feed",[{kinds:[21,22],limit:60}],addCard);
try{const s=localStorage.getItem("nsec");if(s){const d=NT.nip19.decode(s);if(d.type=="nsec")setKey(d.data)}}catch{}
ui();
</script>
</body>
</html>
